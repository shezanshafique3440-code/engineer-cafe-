# Render Blueprint — provisions the PostgreSQL database and the web service
# together. Point Render at this file and it builds the whole stack.
#
# After the first deploy:
#   1. Sign in at /admin/login with the SEED_ADMIN_* values you entered.
#   2. Change the cafe name, phone, WhatsApp number, delivery fee and tax from
#      Admin → Settings. Nothing there needs a redeploy.

databases:
  - name: engineer-cafe-db
    databaseName: engineer_cafe
    user: engineer_cafe
    plan: free
    region: singapore

services:
  - type: web
    name: engineer-cafe
    runtime: node
    plan: free
    region: singapore
    # --include=dev is required: tailwindcss, autoprefixer and tsx are
    # devDependencies, and npm omits those whenever NODE_ENV=production.
    # `migrate deploy` applies the committed migration; the seed is guarded by
    # SEED_ONLY_IF_EMPTY so redeploys never overwrite menu edits made in admin.
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: engineer-cafe-db
          property: connectionString

      # Signing keys for session cookies — generated by Render, never committed.
      - key: AUTH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      # Canonical URL used for SEO metadata, Open Graph tags and the sitemap.
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: engineer-cafe
          property: host

      - key: NODE_VERSION
        value: "22.11.0"

      # Seed the database only while it is still empty.
      - key: SEED_ONLY_IF_EMPTY
        value: "true"

      # Admin login created on the first deploy. Render prompts for these —
      # choose a strong password; it is never stored in the repository.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_CUSTOMER_EMAIL
        sync: false
      - key: SEED_CUSTOMER_PASSWORD
        sync: false

      # Fallback only — the live number is editable in Admin → Settings.
      - key: WHATSAPP_NUMBER
        sync: false

      # Render's filesystem is ephemeral, so uploaded images would vanish on
      # redeploy. Switch to `cloudinary` (or `s3`) and add the matching keys
      # below before uploading product photos from the admin panel.
      - key: UPLOAD_PROVIDER
        value: local
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Payments stay off until a provider is configured; cash flows work today.
      - key: PAYMENT_PROVIDER
        value: none
